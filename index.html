<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Minecraft</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Three.js Import Map -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
            "@dimforge/rapier3d-compat": "https://unpkg.com/@dimforge/rapier3d-compat@0.12.0/rapier.es.js"
        }
    }
    </script>
</head>
<body>
    <div id="ui-layer">
        <div id="crosshair">+</div>
        <div id="hotbar">
            <!-- Block Types -->
            <div class="slot active" data-type="grass" style="background-color: #55aa55;">1</div>
            <div class="slot" data-type="dirt" style="background-color: #8B4513;">2</div>
            <div class="slot" data-type="stone" style="background-color: #808080;">3</div>
            <div class="slot" data-type="wood" style="background-color: #8b5a2b;">4</div>
            <div class="slot" data-type="leaves" style="background-color: #228b22;">5</div>
        </div>
        
        <div id="blocker">
            <div id="instructions">
                <p style="font-size:36px; font-weight: bold;">Click to play</p>
                <p>
                    Move: W A S D<br/>
                    Jump: SPACE<br/>
                    Look: MOUSE<br/>
                    Place block: Right Click<br/>
                    Break block: Left Click<br/>
                    Select Block: 1-5
                </p>
            </div>
        </div>
    </div>
    
    <script type="module" src="main.js"></script>
</body>
</html>
