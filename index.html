<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Minecraft</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Three.js Import Map -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
            "@dimforge/rapier3d-compat": "https://unpkg.com/@dimforge/rapier3d-compat@0.12.0/rapier.es.js"
        }
    }
    </script>
</head>
<body>
    <div id="ui-layer">
        <div id="crosshair">+</div>
        <div id="hotbar">
            <!-- Block Types -->
            <div class="slot active" data-type="grass" style="background-color: #55aa55;">1</div>
            <div class="slot" data-type="dirt" style="background-color: #8B4513;">2</div>
            <div class="slot" data-type="stone" style="background-color: #808080;">3</div>
            <div class="slot" data-type="wood" style="background-color: #8b5a2b;">4</div>
            <div class="slot" data-type="leaves" style="background-color: #228b22;">5</div>
        </div>
        
        <div id="blocker">
            <div id="pause-screen-layer">
                <!-- MAIN START / PAUSE MENU -->
                <div id="menu-main" class="menu-container">
                    <h1 id="menu-title">Game Paused</h1>
                    <button class="mc-button" id="btn-resume">Back to Game</button>
                    <button class="mc-button" id="btn-options">Options</button>
                    <button class="mc-button" id="btn-exit">Save and Quit to Title</button>
                </div>

                <!-- OPTIONS MENU -->
                <div id="menu-options" class="menu-container" style="display: none;">
                    <h1>Options</h1>
                    <button class="mc-button" id="btn-graphics">Graphics...</button>
                    <button class="mc-button" id="btn-controls">Controls...</button>
                    <button class="mc-button" id="btn-options-done">Done</button>
                </div>

                <!-- GRAPHICS MENU -->
                <div id="menu-graphics" class="menu-container" style="display: none;">
                    <h1>Graphics Settings</h1>
                    <div class="row">
                        <span style="color: white; margin-right: 10px;">Render Distance:</span>
                        <input type="range" id="graphics-render-distance" min="20" max="200" value="50" step="10">
                        <span style="color: white; margin-left: 10px;" id="lbl-render-distance">50 chunks</span>
                    </div>
                    <button class="mc-button" id="btn-graphics-done" style="margin-top: 20px;">Done</button>
                </div>

                <!-- CONTROLS MENU -->
                <div id="menu-controls" class="menu-container" style="display: none; max-height: 80vh; overflow-y: auto; padding: 10px;">
                    <h1>Controls</h1>
                    <div class="keybind-row">
                        <span>Walk Forwards</span>
                        <button class="mc-button sm-button keybind-btn" data-action="forward">W</button>
                    </div>
                    <div class="keybind-row">
                        <span>Walk Backwards</span>
                        <button class="mc-button sm-button keybind-btn" data-action="backward">S</button>
                    </div>
                    <div class="keybind-row">
                        <span>Strafe Left</span>
                        <button class="mc-button sm-button keybind-btn" data-action="left">A</button>
                    </div>
                    <div class="keybind-row">
                        <span>Strafe Right</span>
                        <button class="mc-button sm-button keybind-btn" data-action="right">D</button>
                    </div>
                    <div class="keybind-row">
                        <span>Jump</span>
                        <button class="mc-button sm-button keybind-btn" data-action="jump">SPACE</button>
                    </div>
                    <div class="keybind-row">
                        <span>Break Block</span>
                        <button class="mc-button sm-button keybind-btn" data-action="breakBlock">Click L</button>
                    </div>
                    <div class="keybind-row">
                        <span>Place Block</span>
                        <button class="mc-button sm-button keybind-btn" data-action="placeBlock">Click R</button>
                    </div>
                    <div class="keybind-row">
                        <span>Hotbar Slot 1</span>
                        <button class="mc-button sm-button keybind-btn" data-action="slot1">1</button>
                    </div>
                    <div class="keybind-row">
                        <span>Hotbar Slot 2</span>
                        <button class="mc-button sm-button keybind-btn" data-action="slot2">2</button>
                    </div>
                    <div class="keybind-row">
                        <span>Hotbar Slot 3</span>
                        <button class="mc-button sm-button keybind-btn" data-action="slot3">3</button>
                    </div>
                    <div class="keybind-row">
                        <span>Hotbar Slot 4</span>
                        <button class="mc-button sm-button keybind-btn" data-action="slot4">4</button>
                    </div>
                    <div class="keybind-row">
                        <span>Hotbar Slot 5</span>
                        <button class="mc-button sm-button keybind-btn" data-action="slot5">5</button>
                    </div>
                    <button class="mc-button" id="btn-controls-done" style="margin-top: 20px;">Done</button>
                </div>
            </div>
        </div>
    </div>
    
    <script type="module" src="main.js"></script>
</body>
</html>
